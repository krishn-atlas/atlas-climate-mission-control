name: Public Rain Watch Reference Feed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_rain_watch.py'
      - '.github/workflows/public-rain-watch.yml'
  schedule:
    - cron: '9,39 * * * *'
permissions:
  contents: write
concurrency:
  group: public-rain-watch-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public reference rain outlook
        run: python scripts/publish_rain_watch.py
      - name: Commit sanitized feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rain_watch.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public reference rain watch'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
